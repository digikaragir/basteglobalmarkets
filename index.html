<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Baste Global Markets — Forex · Commodities · Indian F&amp;O</title>
    <meta
      name="description"
      content="Baste Global Markets — trading education from an active desk: major forex pairs, global commodities and Indian index options & futures. Courses & 1-on-1 mentorship by Somnath Baste, Pune."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />
    <!-- Site URL comes from VITE_SITE_URL (default set in vite.config.js) — set your real domain before deploying -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Baste Global Markets" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Baste Global Markets — Forex · Commodities · Indian F&amp;O" />
    <meta property="og:description" content="Every market, one desk. Trading education, courses and 1-on-1 mentorship by Somnath Baste." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Baste Global Markets — Every market, one desk." />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Baste Global Markets — Forex · Commodities · Indian F&amp;O" />
    <meta name="twitter:description" content="Every market, one desk. Trading education, courses and 1-on-1 mentorship by Somnath Baste." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Baste Markets" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["Organization", "EducationalOrganization"],
            "@id": "%VITE_SITE_URL%/#org",
            "name": "Baste Global Markets",
            "url": "%VITE_SITE_URL%/",
            "logo": "%VITE_SITE_URL%/apple-touch-icon.png",
            "description": "Trading education from an active desk across major forex pairs, global commodities and Indian index options & futures: courses and 1-on-1 mentorship. Education only; not registered with SEBI as an Investment Adviser or Research Analyst.",
            "founder": { "@id": "%VITE_SITE_URL%/#founder" },
            "address": { "@type": "PostalAddress", "addressLocality": "Pune", "addressRegion": "Maharashtra", "addressCountry": "IN" },
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+91-75079-58364",
              "contactType": "customer service",
              "areaServed": "IN"
            }
          },
          {
            "@type": "Person",
            "@id": "%VITE_SITE_URL%/#founder",
            "name": "Somnath Baste",
            "jobTitle": "Founder & Lead Trader",
            "worksFor": { "@id": "%VITE_SITE_URL%/#org" },
            "telephone": "+91-75079-58364",
            "address": { "@type": "PostalAddress", "addressLocality": "Pune", "addressCountry": "IN" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
